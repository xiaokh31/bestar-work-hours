[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bestar-work-hours-engine"
version = "0.1.0"
description = "Standalone Bestar attendance parser and approved XLS generator"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "click==8.5.0",
  "colorama==0.4.6",
  "fastapi==0.142.2",
  "h11==0.16.0",
  "idna==3.20",
  "opentelemetry-api==1.45.0",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "pydantic==2.13.5",
  "pydantic-core==2.46.5",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.1",
  "starlette==1.7.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "tzdata==2026.2",
  "uvicorn==0.54.0",
  "xlrd==2.0.2",
  "xlwt==1.3.0"
]

[project.scripts]
bestar-hours = "bestar_work_hours.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
bestar_work_hours = ["templates/wage/*.xls", "templates/wage/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
