services:
  database:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: work_hours
      POSTGRES_USER: bestar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - work-hours-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bestar -d work_hours]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: { context: ./apps/engine, target: runtime }
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://bestar:${POSTGRES_PASSWORD}@database:5432/work_hours
      API_SERVICE_SECRET: ${API_SERVICE_SECRET:?Set API_SERVICE_SECRET}
      APP_ENV: production
    command: [python, -m, bestar_work_hours.service.manage, migrate]
    depends_on:
      database: { condition: service_healthy }
  api:
    build: { context: ./apps/engine, target: runtime }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: ./apps/web
    environment:
      API_ORIGIN: http://api:8000
      API_SERVICE_SECRET: ${API_SERVICE_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  work-hours-data:
